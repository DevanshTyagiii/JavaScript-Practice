<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <script>
        let age = 19;
        function printAge() {
            console.log(`Your age is ${age}`);
        }
        printAge();
        age = 76;
        printAge();
        age = 12;
        printAge();
        //sum function. 
        function sum(a, b) {
            let sum = a+b;
            return sum;
        }
        let result = sum(25,67);
        console.log(`Your sum is ${result}`);
    </script>
</body>
</html>
