<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra bag exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <button id="bag" class="add" onclick="cartQty += 1;
    document.querySelector('#cart-summary').innerText = `Your bag has ${cartQty} items`;">Add to bag</button>

    <button id="wish" class="move" onclick="cartQty -= 1;
    document.querySelector('#cart-summary').innerText = `Your bag has ${cartQty} items`;">Move to wishlist</button>

    <button id="sale" class="add" onclick="cartQty += 2;
    document.querySelector('#cart-summary').innerText = `Your bag has ${cartQty} items`;">Add 1+1 sale item</button>

    <h1 id="cart-summary"></h1>
    </main>
    <script src="index.js"></script>
</body>
</html>
