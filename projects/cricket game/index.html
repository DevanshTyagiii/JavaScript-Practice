<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1>BAT BALL STUMP GAME</h1>
        <button class="btn" onclick="
       
        console.log('you have chosen Bat🏏');
        let rn = Math.random() * 3;
        let cc; 
        if(rn > 0 && rn <= 1){
            cc = 'Bat';
        } else if (rn > 1 && rn <= 2) {
            cc = 'Ball'
        } else {
            cc = 'Stump'
        }
        console.log('Computer choice is ${cc}')

        if(cc === 'Ball') {
            console.log('You Won');
        } else if (cc === 'Bat') {
            console.log('Its a Tie!!!')
        } else {
    
            console.log('Computer won')
        }
        
        ">Bat🏏</button>

        <button class="btn" onclick="">Ball🥎</button>
        <button class="btn" onclick="">Stump \|/</button>
    </div>
</body>
</html>
